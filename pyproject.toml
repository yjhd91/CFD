[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reboa-cfd"
version = "0.5.0"
description = "Patient-specific aortic CFD: Watertight mesh, PyPrimeMesh boundary layer, Fluent pulsatile solve, wall-shear metrics"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "CFD contributors" }]
keywords = ["cfd", "ansys", "fluent", "aorta", "wall-shear-stress", "reboa"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "h5py>=3.8",
  "manifold3d>=2.3",
  "openpyxl>=3.1",
  "grpcio>=1.60",
  "protobuf>=4.25",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
cfd = "cfd.cli:main"

[tool.setuptools.packages.find]
include = ["cfd*", "engine*"]

[tool.setuptools.package-data]
cfd = ["templates/*.json"]
engine = ["*.ps1", "*.c"]

[tool.pytest.ini_options]
testpaths = ["tests"]
